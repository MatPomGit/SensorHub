name: Android CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: "Publish the verified debug APK as a durable technical prerelease"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Release tag, e.g. sensorhub-v1.0-rc1; required when publishing"
        required: false
        default: ""
        type: string

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties for CI
        run: |
          # Tworzymy local.properties dynamicznie, aby build był niezależny od systemu dewelopera.
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Run lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: android-reports
          path: |
            app/build/reports
            app/build/test-results

  instrumentation-tests:
    name: Instrumentation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties for CI
        run: |
          # Ten sam mechanizm co w buildzie APK, bez ścieżek zależnych od hosta.
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: androidTest-reports
          path: app/build/reports/androidTests

  publish-prerelease:
    name: Publish technical prerelease
    needs: [build-debug-apk, instrumentation-tests]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          test -n "${{ inputs.release_tag }}" || {
            echo "::error::release_tag is required when publish_prerelease=true"
            exit 2
          }

      - name: Download debug APK from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: release

      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          cd release
          sha256sum app-debug.apk > SHA256SUMS.txt

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: "SensorHub technical prerelease"
          prerelease: true
          body: |
            Technical debug snapshot produced after unit tests, lint and instrumentation tests.
            This release is intended for reproducible evaluation of the repository state.
          files: |
            release/app-debug.apk
            release/SHA256SUMS.txt

      - name: Delete transient APK artifact
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.workflow_run.id == ${{ github.run_id }}) | select(.name == "app-debug-apk") | .id' \
          | while read -r artifact_id; do
              [ -z "$artifact_id" ] && continue
              gh api --method DELETE \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "repos/${GITHUB_REPOSITORY}/actions/artifacts/$artifact_id"
            done
